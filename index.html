<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>爆贴收藏室</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 一本认真做的剪贴本，热闹但干净，给想学爆款写法的人翻
   IDEA: 小红书的双列瀑布流，每张卡片是一篇我们复刻出来的笔记
   PICTURE: 首屏就是复刻封面墙，点开看原帖数据、打分和拆解
   COLOUR and TYPE: 白底，小红书红 #ff2442 主色，暖黄 #ffd84a 只标分数；Noto Sans SC 黑体
   LAYOUT: 顶部标题加三个数字，品类横向滚动条，瀑布网格，右侧抽屉看详情 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141214);--card:light-dark(#ffffff,#1f1b1e);--ink:light-dark(#1b1b1f,#f3eff1);--mute:light-dark(#6b6b74,#a8a1a6);--line:light-dark(#ececf0,#2e292d);--red:#ff2442;--soft:light-dark(#fff1f3,#3a1a20);--yel:#ffd84a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:clip}
a{color:var(--red)}
header{padding:clamp(22px,4vw,48px) max(4vw,16px) 12px;display:grid;gap:14px}
h1{margin:0;font-size:clamp(32px,5vw,48px);line-height:1.05;font-weight:900;text-wrap:balance}
h1 span{color:var(--red)}
.about{margin:0;max-width:62ch;color:var(--mute);font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px}
.stat b{display:block;font-size:clamp(26px,4vw,34px);font-weight:900;line-height:1.1}
.stat small{color:var(--mute);font-size:13px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px max(4vw,16px);display:grid;gap:10px}
.cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;min-height:40px}
.chip[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.chip i{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tools input,.tools select{font:inherit;font-size:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;min-height:44px}
.tools input{flex:1 1 220px}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
main{padding:16px max(4vw,16px) 48px}
.count{color:var(--mute);font-size:14px;margin:0 0 12px}
.grid{columns:5 220px;column-gap:14px}
.card{break-inside:avoid;margin:0 0 16px;background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;display:block;width:100%;text-align:left;padding:0;font:inherit;color:inherit;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}
.card img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:var(--line)}
.card .meta{padding:10px 12px 12px;display:grid;gap:6px}
.card .t{font-weight:700;font-size:15px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--mute)}
.score{background:var(--yel);color:#1b1b1f;font-weight:900;border-radius:8px;padding:1px 8px;font-size:13px;white-space:nowrap}
.more{display:block;margin:8px auto 0;background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 28px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.empty{color:var(--mute);padding:40px 0;text-align:center}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);z-index:21;overflow-y:auto;transform:translateX(100%);transition:transform .2s;padding:20px clamp(16px,3vw,28px) 40px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.open .shade{display:block}.open .drawer{transform:none}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.x{position:sticky;top:0;float:right;border:0;background:var(--card);color:var(--ink);border-radius:999px;width:44px;height:44px;font-size:22px;cursor:pointer;border:1px solid var(--line)}
.drawer h2{font-size:22px;line-height:1.25;margin:4px 52px 6px 0}
.tag{display:inline-block;background:var(--soft);color:var(--red);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;margin:0 6px 6px 0}
.sec{margin-top:18px}
.sec h3{font-size:14px;margin:0 0 8px;color:var(--mute);font-weight:500}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair img{width:100%;border-radius:10px;display:block}
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
.nums div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.nums b{display:block;font-size:18px;white-space:nowrap}.nums small{color:var(--mute);font-size:12px}
.sbar{display:grid;grid-template-columns:4.5em minmax(0,1fr) 4em;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.sbar span:nth-child(2){height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.sbar span:nth-child(2) i{display:block;height:100%;background:var(--red);border-radius:6px}
.sbar span:last-child{text-align:right;white-space:nowrap;color:var(--mute)}
.five{display:grid;grid-template-columns:4em minmax(0,1fr);gap:4px 10px;font-size:14px}
.five dt{color:var(--mute)}.five dd{margin:0}
.note{font-size:13px;color:var(--mute)}
.orig{display:inline-flex;align-items:center;min-height:44px;font-weight:700}
footer{padding:0 max(4vw,16px) 40px;color:var(--mute);font-size:13px;max-width:80ch}
footer details{margin-top:8px}
@media(max-width:600px){.grid{columns:2 150px;column-gap:10px}.card .meta{padding:8px}}
</style>
</head>
<body>
<header>
  <h1>爆贴<span>收藏室</span></h1>
  <p class="about" id="about"></p>
  <div class="stats" id="stats"></div>
</header>
<div class="bar">
  <div class="cats" id="cats" role="group" aria-label="品类"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="搜标题、钩子、账号" aria-label="搜索">
    <select id="sort" aria-label="排序">
      <option value="total">按总分</option>
      <option value="like">按原帖点赞</option>
      <option value="col">按收藏率</option>
      <option value="date">按观察时间</option>
    </select>
  </div>
</div>
<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>再看 60 篇</button>
</main>
<footer>
  <p>每张卡片是我们复刻出来的笔记封面。复刻只学原帖的版式和钩子，题材、文字和图片都是自己做的；原帖图片不在本页展示，点「看原帖」去小红书查看。分数是排序用的写法与互动指标，不代表流量预测。</p>
  <details><summary>怎么收、怎么打分、怎么复刻</summary><div id="method"></div></details>
</footer>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="笔记详情"><button class="x" id="x" aria-label="关闭">×</button><div id="detail"></div></aside>
<script>
{
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>n>=10000?(n/10000).toFixed(n>=100000?0:1)+'万':String(n??0);
const $=id=>document.getElementById(id);
let DATA=[],META={},cat='全部',shown=0,list=[];
const PAGE=60;
const METHOD_AI='复刻图优先复用图库和代码排版，确实需要时才用 GPT 生成，提示词按手机随手拍、生活感、不出现可识别人脸来写；萌宠、明星、影视用真实照片。用了 AI 图的笔记，发布时勾选平台的 AI 生成内容声明。';
function filtered(){
  const q=$('q').value.trim().toLowerCase();
  let a=DATA.filter(p=>cat==='全部'||p.category===cat);
  if(q)a=a.filter(p=>[p.title,p.replica.title,p.category,p.account,p.kw,(p.why||[]).join(' ')].join(' ').toLowerCase().includes(q));
  const s=$('sort').value;
  const key={total:p=>p.score.total||0,like:p=>p.metrics.like||0,col:p=>(p.metrics.collect||0)/Math.max(1,p.metrics.like||1),date:p=>p.observed||''}[s];
  return a.sort((x,y)=>key(x)>key(y)?-1:key(x)<key(y)?1:0);
}
function card(p){
  return `<button class="card" data-k="${esc(p.key)}"><img loading="lazy" src="img/${esc(p.key)}_c.jpg" alt="${esc(p.replica.title)}"><div class="meta"><div class="t">${esc(p.replica.title||p.title)}</div><div class="row"><span>${esc(p.category)}</span><span class="score">${esc(p.score.total)}</span></div></div></button>`;
}
function render(reset){
  if(reset){list=filtered();shown=0;$('grid').innerHTML='';}
  const next=list.slice(shown,shown+PAGE);
  $('grid').insertAdjacentHTML('beforeend',next.map(card).join(''));
  shown+=next.length;
  $('count').textContent=list.length?`共 ${list.length} 篇，已显示 ${shown} 篇`:'';
  if(!list.length)$('grid').innerHTML='<p class="empty">没有找到，换个词试试</p>';
  $('more').hidden=shown>=list.length;
}
function cats(){
  const c={};DATA.forEach(p=>c[p.category]=(c[p.category]||0)+1);
  const arr=[['全部',DATA.length],...Object.entries(c).sort((a,b)=>b[1]-a[1])];
  $('cats').innerHTML=arr.map(([k,n])=>`<button class="chip" data-c="${esc(k)}" aria-pressed="${k===cat}">${esc(k)}<i>${n}</i></button>`).join('');
}
function sbar(label,v,max){return `<div class="sbar"><span>${label}</span><span><i style="width:${Math.max(0,Math.min(100,v/max*100))}%"></i></span><span>${esc(v)} / ${max}</span></div>`}
function open(k){
  const p=DATA.find(x=>x.key===k);if(!p)return;
  const m=p.metrics,s=p.score,cv=p.cover||{};
  $('detail').innerHTML=`
    <span class="tag">${esc(p.category)}</span>${p.format?`<span class="tag">${esc(p.format)}</span>`:''}
    <h2>${esc(p.replica.title)}</h2>
    <div class="note">复刻自原帖「${esc(p.title)}」 · 原帖发布 ${esc(p.published)} · 观察 ${esc(p.observed)}</div>
    <a class="orig" href="${esc(p.url)}" target="_blank" rel="noopener">看原帖 ↗</a>
    <div class="sec"><h3>我们的复刻（共 ${esc(p.replica.n)} 页）</h3>
      <div class="pair"><img src="img/${esc(p.key)}_c.jpg" alt="复刻封面">${p.replica.grid?`<img src="img/${esc(p.key)}_p.jpg" alt="复刻内页">`:''}</div>
      ${p.replica.ai?`<p class="note">${esc(p.replica.ai)}</p>`:''}</div>
    <div class="sec"><h3>原帖互动</h3><div class="nums">
      <div><b>${fmt(m.like)}</b><small>点赞</small></div><div><b>${fmt(m.collect)}</b><small>收藏</small></div>
      <div><b>${fmt(m.comment)}</b><small>评论</small></div><div><b>${fmt(m.share)}</b><small>转发</small></div></div></div>
    <div class="sec"><h3>打分 · 总分 <b style="color:var(--ink)">${esc(s.total)}</b></h3>
      ${sbar('热度',s.heat,30)}${sbar('收藏率',s.collect,25)}${sbar('转发率',s.share,20)}${sbar('讨论',s.discuss,10)}${sbar('可复刻',s.replicable,15)}</div>
    <div class="sec"><h3>为什么有流量</h3>${(p.why||[]).map(w=>`<span class="tag">${esc(w)}</span>`).join('')}</div>
    <div class="sec"><h3>封面拆解</h3><dl class="five">${['构图','色彩','字体','元素','钩子'].map(x=>`<dt>${x}</dt><dd>${esc(cv[x]||'—')}</dd>`).join('')}</dl></div>
    ${p.plan?`<div class="sec"><h3>怎么复刻</h3><p style="margin:0">${esc(p.plan)}</p></div>`:''}
    ${p.kw?`<p class="note">来源：小红书搜索「${esc(p.kw)}」${p.account?' · 发布账号：'+esc(p.account):''}</p>`:''}`;
  document.body.classList.add('open');$('drawer').setAttribute('aria-hidden','false');$('drawer').scrollTop=0;
  try{history.replaceState(null,'','#n'+k)}catch(e){}
  $('x').focus();
}
function close(){document.body.classList.remove('open');$('drawer').setAttribute('aria-hidden','true');try{history.replaceState(null,'',' ')}catch(e){}}
$('cats').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=b.dataset.c;cats();render(true)});
$('grid').addEventListener('click',e=>{const b=e.target.closest('.card');if(b)open(b.dataset.k)});
$('more').addEventListener('click',()=>render(false));
$('q').addEventListener('input',()=>render(true));
$('sort').addEventListener('change',()=>render(true));
$('shade').addEventListener('click',close);$('x').addEventListener('click',close);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
fetch('data.json').then(r=>r.json()).then(d=>{
  DATA=d.posts;META=d.meta;
  $('about').textContent=META.about||'';
  $('stats').innerHTML=[[META.count,'篇已复刻'],[META.categories,'个品类'],[META.pages,'张复刻图'],[META.updated,'最近更新']].map(([v,l])=>`<div class="stat"><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join('');
  const md=Object.assign({},META.method||{},{ai:METHOD_AI});
  $('method').innerHTML=Object.entries(md).map(([k,v])=>`<p><b>${esc({source:'来源',score:'打分',reverse:'拆解',ai:'图片'}[k]||k)}：</b>${esc(v)}</p>`).join('');
  cats();render(true);
  const h=location.hash.slice(1);if(h.startsWith('n'))open(h.slice(1));
}).catch(()=>{$('grid').innerHTML='<p class="empty">数据加载失败，请刷新重试</p>'});
}
</script>
</body>
</html>
